# Configuración del api-gateway (docs/servicios/api-gateway.md).
spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webflux:
          httpclient:
            # Un servicio que no acepta la conexión da 503; uno que no responde a
            # tiempo, 504 (§5).
            connect-timeout: 2000
            response-timeout: 10s
          # Una ruta por servicio. Cada servicio monta su propio prefijo, así que
          # no se reescribe la ruta (§2).
          routes:
            - id: identity-service
              uri: ${IDENTITY_URL:http://localhost:8081}
              predicates:
                - Path=/api/identidad/**
            - id: campaign-service
              uri: ${CAMPAIGN_URL:http://localhost:8082}
              predicates:
                - Path=/api/campanas/**
            - id: contribution-service
              uri: ${CONTRIBUTION_URL:http://localhost:8083}
              predicates:
                - Path=/api/aportes/**
            - id: update-service
              uri: ${UPDATE_URL:http://localhost:8084}
              predicates:
                - Path=/api/novedades/**
            - id: search-service
              uri: ${SEARCH_URL:http://localhost:8085}
              predicates:
                - Path=/api/busqueda/**
            - id: notification-service
              uri: ${NOTIFICATION_URL:http://localhost:8086}
              predicates:
                - Path=/api/notificaciones/**

server:
  port: 8080

logging:
  level:
    # Hibernate Validator avisa que Spring Cloud Gateway usa @Valid sobre listas en
    # sus propias propiedades. No es de este código: se oculta para no ensuciar el log.
    org.hibernate.validator.internal.metadata.aggregated.CascadingMetaDataBuilder: ERROR

# GET /salud para el healthcheck de Docker; no se expone ningún otro endpoint de
# Actuator.
management:
  endpoints:
    web:
      base-path: /
      exposure:
        include: health
      path-mapping:
        health: salud

suertudometro:
  jwt:
    # El mismo secreto con el que identity-service firma los tokens (32 bytes o más).
    secreto: ${JWT_SECRETO:}
  cors:
    # Orígenes del frontend, separados por coma.
    origenes: ${CORS_ORIGENES:http://localhost:4200}
  # Rutas que no piden token, como "MÉTODO /patrón" (§3). Todo lo demás requiere
  # sesión. Al activar la ruta de un servicio, se agregan aquí las suyas.
  rutas-publicas:
    - POST /api/identidad/usuarios
    - POST /api/identidad/sesiones
    - GET /api/identidad/docs/**
    - GET /api/identidad/docs-json
    # campaign-service: el detalle de una campaña y sus imágenes. Sin sesión, el
    # servicio solo muestra las PUBLICADA, FINALIZADA y CANCELADA. {id} solo
    # admite un UUID, para que GET /api/campanas/mias siga pidiendo sesión.
    - "GET /api/campanas/{id:[0-9a-fA-F-]+}"
    - "GET /api/campanas/{id:[0-9a-fA-F-]+}/imagenes/*"
    # contribution-service: el historial de aportes de una campaña (?idCampana=).
    # Solo esa ruta exacta; /mios, /recibidos y /{idAporte} piden sesión.
    - GET /api/aportes
    # update-service: el historial de novedades de una campaña y su Swagger.
    - GET /api/novedades/campana/*
    - GET /api/novedades/esquema
    - GET /api/novedades/documentacion
    # search-service: el catálogo (texto, filtros, orden y páginas).
    - GET /api/busqueda
    # notification-service: su Swagger. La bandeja siempre pide sesión.
    - GET /api/notificaciones/docs/**
    - GET /api/notificaciones/docs-json
