# Sistema de Suertudómetro con Docker Compose (docs/diagramas/despliegue.excalidraw).
#
#   cp .env.example .env      # una sola vez; el .env no se sube al repositorio
#   docker compose up --build
#
# Aplicación web: http://localhost:4200 · API Gateway: http://localhost:8080
# Las bases de datos y los servicios no se publican al host: todo entra por el
# gateway.
#
# Por ahora están identity-service, el api-gateway y el frontend. Cada servicio
# nuevo se agrega aquí, con su base, en el PR que activa su ruta en el gateway.

name: suertudometro

services:
  identity-db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: identity
      POSTGRES_USER: identity
      POSTGRES_PASSWORD: ${IDENTITY_DB_CONTRASENA:?Falta IDENTITY_DB_CONTRASENA en .env (copia .env.example)}
    volumes:
      # Desde PostgreSQL 18, el volumen va en /var/lib/postgresql.
      - identity-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U identity -d identity"]
      interval: 5s
      timeout: 3s
      retries: 10

  identity-service:
    build: ./identity-service
    environment:
      NODE_ENV: production
      PUERTO: 8081
      DATABASE_URL: postgresql://identity:${IDENTITY_DB_CONTRASENA}@identity-db:5432/identity
      JWT_SECRETO: ${JWT_SECRETO:?Falta JWT_SECRETO en .env (copia .env.example)}
      JWT_DURACION: ${JWT_DURACION:-3600}
      ADMIN_CORREO: ${ADMIN_CORREO:?Falta ADMIN_CORREO en .env (copia .env.example)}
      ADMIN_CONTRASENA: ${ADMIN_CONTRASENA:?Falta ADMIN_CONTRASENA en .env (copia .env.example)}
    depends_on:
      identity-db:
        condition: service_healthy

  api-gateway:
    build: ./api-gateway
    environment:
      JWT_SECRETO: ${JWT_SECRETO:?Falta JWT_SECRETO en .env (copia .env.example)}
      IDENTITY_URL: http://identity-service:8081
      CORS_ORIGENES: http://localhost:4200
    ports:
      - "8080:8080"
    depends_on:
      - identity-service

  frontend:
    build: ./frontend
    ports:
      - "4200:80"

volumes:
  identity-data:
