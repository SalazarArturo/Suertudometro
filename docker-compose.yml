# Sistema de Suertudómetro con Docker Compose (docs/diagramas/despliegue.excalidraw).
#
#   cp .env.example .env      # una sola vez; el .env no se sube al repositorio
#   docker compose up --build
#
# Aplicación web: http://localhost:4200 · API Gateway: http://localhost:8080
# Consola de RabbitMQ: http://localhost:15672 · Mailpit: http://localhost:8025
# Las bases de datos, los servicios y el puerto AMQP de RabbitMQ no se publican
# al host: todo entra por el gateway.
#
# Por ahora están identity-service, el api-gateway, el frontend, RabbitMQ y
# Mailpit. Cada servicio nuevo se agrega aquí, con su base, en el PR que activa
# su ruta en el gateway. Cómo usa RabbitMQ cada servicio: docs/rabbitmq.md.

name: suertudometro

services:
  identity-db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: identity
      POSTGRES_USER: identity
      POSTGRES_PASSWORD: ${IDENTITY_DB_CONTRASENA:?Falta IDENTITY_DB_CONTRASENA en .env (copia .env.example)}
    volumes:
      # Desde PostgreSQL 18, el volumen va en /var/lib/postgresql.
      - identity-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U identity -d identity"]
      interval: 5s
      timeout: 3s
      retries: 10

  identity-service:
    build: ./identity-service
    environment:
      NODE_ENV: production
      PUERTO: 8081
      DATABASE_URL: postgresql://identity:${IDENTITY_DB_CONTRASENA}@identity-db:5432/identity
      JWT_SECRETO: ${JWT_SECRETO:?Falta JWT_SECRETO en .env (copia .env.example)}
      JWT_DURACION: ${JWT_DURACION:-3600}
      ADMIN_CORREO: ${ADMIN_CORREO:?Falta ADMIN_CORREO en .env (copia .env.example)}
      ADMIN_CONTRASENA: ${ADMIN_CONTRASENA:?Falta ADMIN_CONTRASENA en .env (copia .env.example)}
    depends_on:
      identity-db:
        condition: service_healthy

  api-gateway:
    build: ./api-gateway
    environment:
      JWT_SECRETO: ${JWT_SECRETO:?Falta JWT_SECRETO en .env (copia .env.example)}
      IDENTITY_URL: http://identity-service:8081
      CORS_ORIGENES: http://localhost:4200
    ports:
      - "8080:8080"
    depends_on:
      - identity-service

  frontend:
    build: ./frontend
    ports:
      - "4200:80"

  # Bus de eventos. Los servicios se conectan a amqp://<usuario>:<clave>@rabbitmq:5672
  # y cada uno declara sus colas al arrancar (docs/rabbitmq.md).
  rabbitmq:
    image: rabbitmq:4.3-management-alpine
    # RabbitMQ guarda sus datos con el nombre del nodo (rabbit@<hostname>). Con un
    # hostname fijo, recrear el contenedor no deja las colas huérfanas en el volumen.
    hostname: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USUARIO:?Falta RABBITMQ_USUARIO en .env (copia .env.example)}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_CLAVE:?Falta RABBITMQ_CLAVE en .env (copia .env.example)}
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    ports:
      # Solo la consola web. El puerto AMQP (5672) queda en la red interna.
      - "15672:15672"
    healthcheck:
      # Listo cuando acepta conexiones AMQP, no solo cuando el proceso responde.
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s

  # Correo de prueba. notification-service envía por SMTP a mailpit:1025 (red
  # interna) y los correos se ven en http://localhost:8025. No guarda nada entre
  # reinicios.
  mailpit:
    image: axllent/mailpit:v1.33
    ports:
      - "8025:8025"

volumes:
  identity-data:
  rabbitmq-data:
