# Sistema de Suertudómetro con Docker Compose (docs/diagramas/despliegue.excalidraw).
#
#   cp .env.example .env      # una sola vez; el .env no se sube al repositorio
#   docker compose up --build
#
# Aplicación web: http://localhost:4200 · API Gateway: http://localhost:8080
# Consola de RabbitMQ: http://localhost:15672 · Mailpit: http://localhost:8025
# Las bases de datos, los servicios y el puerto AMQP de RabbitMQ no se publican
# al host: todo entra por el gateway.
#
# Están los seis servicios, cada uno con su base, más el api-gateway, el
# frontend, RabbitMQ y Mailpit. Cómo usa RabbitMQ cada servicio:
# docs/rabbitmq.md.

name: suertudometro

# update-service corre en cuatro contenedores con la misma imagen, como en
# update-service/compose.yaml: las migraciones (una vez, al arrancar), la API, el
# consumidor de eventos y el publicador de su outbox.
x-update-service: &update-service
  image: suertudometro-update-service
  build:
    context: ./update-service
    target: ejecucion
  environment:
    DJANGO_CLAVE_SECRETA: ${UPDATE_DJANGO_CLAVE_SECRETA:?Falta UPDATE_DJANGO_CLAVE_SECRETA en .env (copia .env.example)}
    # El gateway llama a http://update-service:8084, y Django rechaza cualquier
    # otro Host.
    DJANGO_HOSTS_PERMITIDOS: update-service
    POSTGRES_DB: update
    POSTGRES_USER: update
    POSTGRES_PASSWORD: ${UPDATE_DB_CONTRASENA:?Falta UPDATE_DB_CONTRASENA en .env (copia .env.example)}
    POSTGRES_HOST: update-db
    RABBITMQ_URL: amqp://${RABBITMQ_USUARIO}:${RABBITMQ_CLAVE}@rabbitmq:5672/%2F

# search-service corre en tres contenedores con la misma imagen, como en
# search-service/compose.yaml: las migraciones (una vez, al arrancar), la API y
# el consumidor de eventos que arma el catálogo.
x-search-service: &search-service
  image: suertudometro-search-service
  build:
    context: ./search-service
    target: ejecucion
  environment:
    DJANGO_CLAVE_SECRETA: ${SEARCH_DJANGO_CLAVE_SECRETA:?Falta SEARCH_DJANGO_CLAVE_SECRETA en .env (copia .env.example)}
    # search-service es el Host con el que llama el gateway; 127.0.0.1, el del
    # healthcheck.
    DJANGO_HOSTS_PERMITIDOS: search-service,127.0.0.1
    POSTGRES_DB: search
    POSTGRES_USER: search
    POSTGRES_PASSWORD: ${SEARCH_DB_CONTRASENA:?Falta SEARCH_DB_CONTRASENA en .env (copia .env.example)}
    POSTGRES_HOST: search-db
    RABBITMQ_URL: amqp://${RABBITMQ_USUARIO}:${RABBITMQ_CLAVE}@rabbitmq:5672/%2F

services:
  identity-db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: identity
      POSTGRES_USER: identity
      POSTGRES_PASSWORD: ${IDENTITY_DB_CONTRASENA:?Falta IDENTITY_DB_CONTRASENA en .env (copia .env.example)}
    volumes:
      # Desde PostgreSQL 18, el volumen va en /var/lib/postgresql.
      - identity-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U identity -d identity"]
      interval: 5s
      timeout: 3s
      retries: 10

  identity-service:
    build: ./identity-service
    environment:
      NODE_ENV: production
      PUERTO: 8081
      DATABASE_URL: postgresql://identity:${IDENTITY_DB_CONTRASENA}@identity-db:5432/identity
      JWT_SECRETO: ${JWT_SECRETO:?Falta JWT_SECRETO en .env (copia .env.example)}
      JWT_DURACION: ${JWT_DURACION:-3600}
      ADMIN_CORREO: ${ADMIN_CORREO:?Falta ADMIN_CORREO en .env (copia .env.example)}
      ADMIN_CONTRASENA: ${ADMIN_CONTRASENA:?Falta ADMIN_CONTRASENA en .env (copia .env.example)}
      # Publica usuario.registrado desde su outbox (docs/servicios/identity-service.md §6).
      RABBITMQ_URL: amqp://${RABBITMQ_USUARIO}:${RABBITMQ_CLAVE}@rabbitmq:5672
    depends_on:
      identity-db:
        condition: service_healthy
      # No la necesita para arrancar (los eventos esperan en el outbox), pero así
      # el primer arranque no llena el log de reintentos de conexión.
      rabbitmq:
        condition: service_healthy

  campaign-db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: campaign
      POSTGRES_USER: campaign
      POSTGRES_PASSWORD: ${CAMPAIGN_DB_CONTRASENA:?Falta CAMPAIGN_DB_CONTRASENA en .env (copia .env.example)}
    volumes:
      - campaign-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U campaign -d campaign"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Publica los eventos de campaña y consume aporte.registrado (cola
  # campaign-service.aportes). Guarda las imágenes en el volumen campaign-images.
  campaign-service:
    build:
      context: ./campaign-service
      target: ejecucion
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://campaign-db:5432/campaign
      SPRING_DATASOURCE_USERNAME: campaign
      SPRING_DATASOURCE_PASSWORD: ${CAMPAIGN_DB_CONTRASENA}
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_USUARIO}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_CLAVE}
      CAMPANA_DIRECTORIO_IMAGENES: /var/lib/suertudometro/campaign-images
    volumes:
      - campaign-images:/var/lib/suertudometro/campaign-images
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://127.0.0.1:8082/salud"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 60s
    depends_on:
      campaign-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  contribution-db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: contribution
      POSTGRES_USER: contribution
      POSTGRES_PASSWORD: ${CONTRIBUTION_DB_CONTRASENA:?Falta CONTRIBUTION_DB_CONTRASENA en .env (copia .env.example)}
    volumes:
      - contribution-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U contribution -d contribution"]
      interval: 5s
      timeout: 3s
      retries: 10

  # El healthcheck (GET /salud) viene en su Dockerfile. Corre sin el perfil
  # `local`: no crea campañas de prueba, las conoce por campana.publicada
  # (docs/servicios/contribution-service.md §6).
  contribution-service:
    build: ./contribution-service
    environment:
      CONTRIBUTION_DB_URL: jdbc:postgresql://contribution-db:5432/contribution
      CONTRIBUTION_DB_USUARIO: contribution
      CONTRIBUTION_DB_CONTRASENA: ${CONTRIBUTION_DB_CONTRASENA}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USUARIO: ${RABBITMQ_USUARIO}
      RABBITMQ_CLAVE: ${RABBITMQ_CLAVE}
    depends_on:
      contribution-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  update-db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: update
      POSTGRES_USER: update
      POSTGRES_PASSWORD: ${UPDATE_DB_CONTRASENA:?Falta UPDATE_DB_CONTRASENA en .env (copia .env.example)}
    volumes:
      - update-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U update -d update"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Aplica las migraciones de Django y termina.
  update-migrations:
    <<: *update-service
    command: ["python", "manage.py", "migrate", "--noinput"]
    depends_on:
      update-db:
        condition: service_healthy

  update-service:
    <<: *update-service
    depends_on:
      update-migrations:
        condition: service_completed_successfully
    healthcheck:
      # La imagen no trae curl ni wget, y el servicio no tiene /salud: basta con
      # que gunicorn acepte conexiones en el 8084.
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('127.0.0.1', 8084), 2)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  # Consume campana.publicada y campana.cerrada (cola update-service.campanas).
  update-worker:
    <<: *update-service
    command: ["python", "manage.py", "consumir_eventos"]
    depends_on:
      update-migrations:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy

  # Publica campana.actualizada desde el outbox (eventos_pendientes).
  update-publisher:
    <<: *update-service
    command: ["python", "manage.py", "publicar_eventos"]
    depends_on:
      update-migrations:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy

  search-db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: search
      POSTGRES_USER: search
      POSTGRES_PASSWORD: ${SEARCH_DB_CONTRASENA:?Falta SEARCH_DB_CONTRASENA en .env (copia .env.example)}
    volumes:
      - search-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U search -d search"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Aplica las migraciones de Django y termina.
  search-migrations:
    <<: *search-service
    command: ["python", "manage.py", "migrate", "--noinput"]
    depends_on:
      search-db:
        condition: service_healthy

  search-service:
    <<: *search-service
    depends_on:
      search-migrations:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8085/salud', timeout=3).close()"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  # Arma el catálogo con campana.publicada, aporte.registrado, meta.alcanzada y
  # campana.cerrada (cola search-service.campanas).
  search-worker:
    <<: *search-service
    command: ["python", "manage.py", "consumir_eventos"]
    depends_on:
      search-migrations:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy

  notification-db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: notification
      POSTGRES_USER: notification
      POSTGRES_PASSWORD: ${NOTIFICATION_DB_CONTRASENA:?Falta NOTIFICATION_DB_CONTRASENA en .env (copia .env.example)}
    volumes:
      - notification-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U notification -d notification"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Consume los siete eventos (cola notification-service.avisos), guarda los
  # avisos y los manda por correo a Mailpit. El healthcheck (GET /salud) viene en
  # su Dockerfile.
  notification-service:
    build: ./notification-service
    environment:
      NODE_ENV: production
      PUERTO: 8086
      DATABASE_URL: postgresql://notification:${NOTIFICATION_DB_CONTRASENA}@notification-db:5432/notification
      RABBITMQ_URL: amqp://${RABBITMQ_USUARIO}:${RABBITMQ_CLAVE}@rabbitmq:5672
      SMTP_HOST: mailpit
      SMTP_PUERTO: 1025
      # Para los enlaces de los correos: los abre el navegador, en el host.
      URL_FRONTEND: http://localhost:4200
    depends_on:
      notification-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      mailpit:
        condition: service_started

  api-gateway:
    build: ./api-gateway
    environment:
      JWT_SECRETO: ${JWT_SECRETO:?Falta JWT_SECRETO en .env (copia .env.example)}
      IDENTITY_URL: http://identity-service:8081
      CAMPAIGN_URL: http://campaign-service:8082
      CONTRIBUTION_URL: http://contribution-service:8083
      UPDATE_URL: http://update-service:8084
      SEARCH_URL: http://search-service:8085
      NOTIFICATION_URL: http://notification-service:8086
      CORS_ORIGENES: http://localhost:4200
    ports:
      - "8080:8080"
    depends_on:
      - identity-service
      - campaign-service
      - contribution-service
      - update-service
      - search-service
      - notification-service

  frontend:
    build: ./frontend
    ports:
      - "4200:80"

  # Bus de eventos. Los servicios se conectan a amqp://<usuario>:<clave>@rabbitmq:5672
  # y cada uno declara sus colas al arrancar (docs/rabbitmq.md).
  rabbitmq:
    image: rabbitmq:4.3-management-alpine
    # RabbitMQ guarda sus datos con el nombre del nodo (rabbit@<hostname>). Con un
    # hostname fijo, recrear el contenedor no deja las colas huérfanas en el volumen.
    hostname: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USUARIO:?Falta RABBITMQ_USUARIO en .env (copia .env.example)}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_CLAVE:?Falta RABBITMQ_CLAVE en .env (copia .env.example)}
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    ports:
      # Solo la consola web. El puerto AMQP (5672) queda en la red interna.
      - "15672:15672"
    healthcheck:
      # Listo cuando acepta conexiones AMQP, no solo cuando el proceso responde.
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s

  # Correo de prueba. notification-service envía por SMTP a mailpit:1025 (red
  # interna) y los correos se ven en http://localhost:8025. No guarda nada entre
  # reinicios.
  mailpit:
    image: axllent/mailpit:v1.33
    ports:
      - "8025:8025"

volumes:
  identity-data:
  campaign-data:
  campaign-images:
  contribution-data:
  update-data:
  search-data:
  notification-data:
  rabbitmq-data:
