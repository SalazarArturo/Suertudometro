spring:
  application:
    name: campaign-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/campaign_db}
    username: ${SPRING_DATASOURCE_USERNAME:campanas}
    password: ${SPRING_DATASOURCE_PASSWORD:campanas}
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:localhost}
    port: ${SPRING_RABBITMQ_PORT:5672}
    username: ${SPRING_RABBITMQ_USERNAME:guest}
    password: ${SPRING_RABBITMQ_PASSWORD:guest}
    listener:
      simple:
        default-requeue-rejected: false
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 1000ms
          multiplier: 2.0
          max-interval: 4000ms

server:
  port: ${SERVER_PORT:8082}

campana:
  almacenamiento:
    directorio-imagenes: ${CAMPANA_DIRECTORIO_IMAGENES:/var/lib/suertudometro/campaign-images}
  mensajeria:
    exchange: ${CAMPANA_EXCHANGE_EVENTOS:suertudometro.events}
    dlx: ${CAMPANA_EXCHANGE_DLX:suertudometro.events.dlx}
    cola-aportes: ${CAMPANA_COLA_APORTES:campaign-service.aportes}
    cola-dlq: ${CAMPANA_COLA_DLQ:campaign-service.dlq}
    publicador-habilitado: ${CAMPANA_PUBLICADOR_HABILITADO:true}
  tareas:
    expiracion-habilitada: ${CAMPANA_EXPIRACION_HABILITADA:true}
