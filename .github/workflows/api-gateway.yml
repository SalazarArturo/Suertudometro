# CI del api-gateway (docs/servicios/api-gateway.md §10): formato y pruebas en
# cada PR que lo toque, y la imagen de Docker.
name: api-gateway

on:
  pull_request:
    paths:
      - 'api-gateway/**'
      - '.github/workflows/api-gateway.yml'
  push:
    branches: [main]
    paths:
      - 'api-gateway/**'
      - '.github/workflows/api-gateway.yml'

permissions:
  contents: read

concurrency:
  group: api-gateway-${{ github.ref }}
  cancel-in-progress: true

jobs:
  calidad:
    name: Formato, pruebas y compilación
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api-gateway
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: maven
          cache-dependency-path: api-gateway/pom.xml
      # verify corre las pruebas y el chequeo de Spotless (google-java-format).
      - run: ./mvnw -B verify

  imagen:
    name: Imagen de Docker
    runs-on: ubuntu-latest
    needs: calidad
    steps:
      - uses: actions/checkout@v7
      - run: docker build --tag api-gateway:ci api-gateway
