# Sirve el build de Angular (docs/frontend.md §9).
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_min_length 1024;
  gzip_types text/css application/javascript application/json image/svg+xml;

  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  # El build pone un hash en el nombre de los .js y .css: no cambian nunca,
  # así que el navegador los guarda un año.
  location ~* \.(?:js|css)$ {
    expires 1y;
    try_files $uri =404;
  }

  # Cualquier ruta de la aplicación (/perfil, /ingresar…) devuelve index.html,
  # y el router de Angular decide qué mostrar. Así, recargar en /perfil no da
  # 404. index.html no se guarda, para que una versión nueva se vea al recargar.
  location / {
    expires -1;
    try_files $uri $uri/ /index.html;
  }
}
